[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courseascode"
version = "0.1.0"
description = "Engine de Moodle Course as Code: renderer, catálogo y deployment de contenido docente versionado en Git hacia Moodle."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.scripts]
courseascode = "courseascode.cli.main:app"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/courseascode"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "PL", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["courseascode", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
