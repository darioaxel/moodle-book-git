# Entorno de desarrollo completo del sistema (ENG-105):
# servicio courseascode (engine) + Moodle + MariaDB.
#
# Uso:
#   docker compose up --build
#   Servicio: http://localhost:8000  ·  Moodle: http://localhost:8080
#
# El plugin Moodle `local_courseascode` 🔌 es una pista paralela: su código no
# vive en este repo. Cuando exista, descomenta el volumen en el servicio
# `moodle` para montarlo sobre la instalación.

services:
  engine:
    build: engine/
    ports:
      - "8000:8000"
    environment:
      # Repo de contenidos montado (working tree que sirve la preview/catálogo).
      CONTENT_REPO: /content
      # Credenciales de desarrollo; en producción viven fuera del compose.
      MOODLE_URL: http://moodle:8080
      MOODLE_TOKEN: ${MOODLE_TOKEN:-dev-token-cambiar}
      COURSEASCODE_DB: /data/courseascode.db
      COURSEASCODE_ADMIN_TOKEN: ${COURSEASCODE_ADMIN_TOKEN:-dev-admin-cambiar}
      COURSEASCODE_WEBHOOK_SECRET: ${COURSEASCODE_WEBHOOK_SECRET:-dev-secret-cambiar}
      COURSEASCODE_LOG_FORMAT: console
    volumes:
      # Sustituye la ruta por tu clon del repo de contenidos.
      - ${CONTENT_REPO:-./content}:/content:ro
      - engine-data:/data
    depends_on:
      - moodle

  moodle:
    image: moodlehq/moodle-php-apache:latest
    ports:
      - "8080:80"
    environment:
      MOODLE_DOCKER_DBTYPE: mysqli
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: moodle
    volumes:
      - moodle-data:/var/www/moodledata
      # Plugin local_courseascode 🔌 (pista paralela; descomentar cuando exista):
      # - ../local_courseascode:/var/www/html/local/courseascode:ro
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_ROOT_PASSWORD: root-dev-cambiar
    volumes:
      - db-data:/var/lib/mysql

volumes:
  engine-data:
  moodle-data:
  db-data:
